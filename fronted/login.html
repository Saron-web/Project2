<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diet Insights — Log In</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent-hover: #16a34a;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--bg);
    border-radius: 8px;
    padding: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab-btn.active { background: var(--accent); color: #05230f; font-weight: 600; }
  form { display: none; flex-direction: column; gap: 12px; }
  form.active { display: flex; }
  label { font-size: 0.85rem; color: var(--muted); }
  input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button.submit {
    margin-top: 8px;
    padding: 10px;
    background: var(--accent);
    color: #05230f;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button.submit:hover { background: var(--accent-hover); }
  button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 0.8rem;
    margin: 20px 0;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .oauth-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .oauth-btn:hover { background: #1f2937; }
  .msg { font-size: 0.85rem; margin-top: 4px; min-height: 1.2em; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Diet Insights</h1>
    <p class="sub">Sign in to view your dashboard</p>

    <div class="tabs">
      <button class="tab-btn active" data-target="login-form" type="button">Log In</button>
      <button class="tab-btn" data-target="register-form" type="button">Register</button>
    </div>

    <form id="login-form" class="active">
      <div>
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" required>
      </div>
      <div>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="submit" type="submit">Log In</button>
      <div class="msg" id="login-msg"></div>
    </form>

    <form id="register-form">
      <div>
        <label for="register-email">Email</label>
        <input id="register-email" type="email" autocomplete="email" required>
      </div>
      <div>
        <label for="register-password">Password</label>
        <input id="register-password" type="password" autocomplete="new-password" minlength="8" required>
        <div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">At least 8 characters</div>
      </div>
      <button class="submit" type="submit">Create Account</button>
      <div class="msg" id="register-msg"></div>
    </form>

    <div class="divider">or</div>

    <a class="oauth-btn" id="github-login" href="#">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07
        -1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0
        .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82
        .44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      Continue with GitHub
    </a>
  </div>

  <script>
    // Update this if your Function App's default hostname or route prefix changes.
    const API_BASE = "https://diet-insights-func-20260811-plan.azurewebsites.net/api";
    const GITHUB_CLIENT_ID = "Ov23liSpg51bwAdsZC5x"; //
    const OAUTH_REDIRECT_URI = `${API_BASE}/oauth_callback`;

    document.getElementById("github-login").href =
      `https://github.com/login/oauth/authorize?client_id=${encodeURIComponent(GITHUB_CLIENT_ID)}` +
      `&redirect_uri=${encodeURIComponent(OAUTH_REDIRECT_URI)}&scope=read:user user:email`;

    // Tab switching
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll("form").forEach(f => f.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.target).classList.add("active");
      });
    });

    function setMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = "msg" + (type ? " " + type : "");
    }

    function storeSessionAndRedirect(token, email) {
      localStorage.setItem("authToken", token);
      localStorage.setItem("userEmail", email);
      window.location.href = "index.html";
    }

    // Handle token coming back from the GitHub OAuth redirect (URL fragment)
    (function handleOAuthRedirect() {
      if (window.location.hash.startsWith("#token=")) {
        const params = new URLSearchParams(window.location.hash.slice(1));
        const token = params.get("token");
        const email = params.get("email");
        if (token && email) {
          storeSessionAndRedirect(token, email);
        }
      }
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      setMsg("login-msg", "Signing in...", "");

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          setMsg("login-msg", data.error || "Login failed", "error");
          return;
        }
        setMsg("login-msg", "Success! Redirecting...", "success");
        storeSessionAndRedirect(data.token, data.email);
      } catch (err) {
        setMsg("login-msg", "Network error — please try again", "error");
      }
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("register-email").value.trim();
      const password = document.getElementById("register-password").value;
      setMsg("register-msg", "Creating account...", "");

      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          setMsg("register-msg", data.error || "Registration failed", "error");
          return;
        }
        setMsg("register-msg", "Account created! Redirecting...", "success");
        storeSessionAndRedirect(data.token, data.email);
      } catch (err) {
        setMsg("register-msg", "Network error — please try again", "error");
      }
    });
  </script>
</body>
</html>
