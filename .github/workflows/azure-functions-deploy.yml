name: Deploy Diet Insights Function App

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: diet-insights-func-20260811-plan
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'api'
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Zip package
        shell: bash
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          zip -r ../function-app.zip . -x "*.pyc" -x "*__pycache__*" -x ".venv/*"

      - name: Deploy via kudu zip deploy
        shell: bash
        run: |
          curl -X POST \
            "https://diet-insights-func-20260811-plan.scm.azurewebsites.net/api/zipdeploy" \
            -u "${{ secrets.KUDU_USERNAME }}:${{ secrets.KUDU_PASSWORD }}" \
            --data-binary @function-app.zip \
            -H "Content-Type: application/octet-stream" \
            --fail \
            --show-error